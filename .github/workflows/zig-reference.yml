name: Zig reference compiler

on:
  pull_request:
    paths:
      - '.github/workflows/zig-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set isolated cache directory
        run: echo "DENO_DIR=$RUNNER_TEMP/deno-cache" >> "$GITHUB_ENV"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.5.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.22'
      - name: Install the reference Bend release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bend-release"
          cd "$RUNNER_TEMP/bend-release"
          curl --fail --location --retry 3 --output bend.tar.gz https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz
          echo '5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  bend.tar.gz' | sha256sum --check
          tar -xzf bend.tar.gz
          binary=$(find "$PWD" -type f -name bend -perm -u+x | head -n 1)
          test -n "$binary"
          dirname "$binary" >> "$GITHUB_PATH"
      - name: Cache frontend dependencies and matching reference loader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/compiler/bend-2.0.32
          for name in main.ts bend.ts comp.ts safe.ts base.bend; do
            curl --fail --location --retry 3 --output "generated/compiler/bend-2.0.32/$name" "https://raw.githubusercontent.com/bendlang/bend/v2.0.32/bend2/$name"
          done
          deno cache compiler/syntax.ts
          mkdir -p "$RUNNER_TEMP/reference-tools"
          tar -czf "$RUNNER_TEMP/reference-tools/loader.tar.gz" generated/compiler/bend-2.0.32
          cp "$(command -v deno)" "$RUNNER_TEMP/reference-tools/deno"
          cp "$(command -v bun)" "$RUNNER_TEMP/reference-tools/bun"
          tar -czf "$RUNNER_TEMP/reference-tools/deno-cache.tar.gz" -C "$DENO_DIR" .
          if test -d node_modules; then tar -czf "$RUNNER_TEMP/reference-tools/node_modules.tar.gz" node_modules; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zig-reference-tools
          path: ${{ runner.temp }}/reference-tools/*
          retention-days: 1
          if-no-files-found: error
      - name: Check original source proofs
        run: |
          bend version
          bend guide > "$RUNNER_TEMP/bend-guide.txt"
          bend PROOF.bend
      - name: Build unchanged JavaScript reference modules sequentially
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          loader="file://$GITHUB_WORKSPACE/generated/compiler/bend-2.0.32/main.ts"
          for module in main native_session native_output; do
            output="$module"
            test "$module" != main || output=compiler
            bun --eval 'const {load}=await import(process.argv[1]); const result=await load(process.argv[2], {},()=>{throw new Error("unrecognized Bend entry")}); process.stdout.write(result.source);' "$loader" "file://$GITHUB_WORKSPACE/compiler/$module.bend" > "generated/compiler/$output.js"
            test -s "generated/compiler/$output.js"
            echo "Built $output.js"
          done
          deno cache compiler/native.ts compiler/source.ts compiler/native_incremental.ts compiler/native_project.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zig-reference-modules
          path: generated/compiler/*.js
          retention-days: 1
          if-no-files-found: error
