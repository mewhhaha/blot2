name: OxCaml standalone
on:
  push:
    branches: [rebuild/oxcaml-compiler]
    paths: ['compiler/**', 'std/**', 'generated/wasm/**', 'deno.json', 'deno.lock', 'Justfile', '.github/workflows/oxcaml-runtime.yml']
  pull_request:
    paths: ['compiler/**', 'std/**', 'generated/wasm/**', 'deno.json', 'deno.lock', 'Justfile', '.github/workflows/oxcaml-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oxcaml-standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y opam autoconf build-essential
      - uses: actions/cache@v4
        with:
          path: ~/.opam
          key: oxcaml-5.2.0-ox-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install OxCaml
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0
          opam init --bare --disable-sandboxing -y
          if ! opam switch list --short | grep -Fxq 5.2.0+ox; then
            opam switch create 5.2.0+ox --repos ox=git+https://github.com/oxcaml/opam-repository.git,default -y
          fi
          opam exec --switch 5.2.0+ox -- ocamlopt -config
      - name: Build and test checked-in native source
        run: opam exec --switch 5.2.0+ox -- make -C compiler/oxcaml test test-build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test without Bend or generated reference artifacts
        run: |
          test ! -f generated/compiler/compiler.js
          test ! -f generated/compiler/blotc
          deno run --allow-all compiler/oxcaml/smoke.ts
          deno task blot:oxcaml build examples/scalar.blot build/oxcaml-smoke.wasm
          opam exec --switch 5.2.0+ox -- deno task build:compiler:oxcaml
          deno task blot check examples/generic_effects.blot
          deno task blot build examples/arrays.blot build/oxcaml-arrays.wasm
          test ! -f generated/compiler/compiler.js
      - name: Export minimal development snapshot
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[dev-snapshot]'))
        run: |
          mkdir -p development-snapshot toolchain/bin toolchain/lib/ocaml
          git archive --format=tar.gz HEAD > development-snapshot/source.tar.gz
          git rev-parse HEAD > development-snapshot/source.sha
          opam exec --switch 5.2.0+ox -- ocamlopt -config > development-snapshot/ocaml-config.txt
          prefix="$HOME/.opam/5.2.0+ox"
          cp -L "$prefix/bin/ocamlopt" toolchain/bin/ocamlopt
          strip --strip-debug toolchain/bin/ocamlopt
          find -L "$prefix/lib/ocaml" -maxdepth 1 -type f \( -name '*.cmi' -o -name '*.cmx' -o -name '*.cmxa' -o -name '*.a' -o -name '*.o' -o -name 'Makefile.config' \) -exec cp -L {} toolchain/lib/ocaml/ \;
          for directory in caml threads unix; do
            if test -d "$prefix/lib/ocaml/$directory"; then
              cp -Lr "$prefix/lib/ocaml/$directory" toolchain/lib/ocaml/
            fi
          done
          find toolchain/lib -type f \( -name '*.cmt' -o -name '*.cmti' -o -name '*.cmxs' \) -delete
          find toolchain/lib -type f \( -name '*.a' -o -name '*.o' \) -exec strip --strip-debug {} +
          tar -C toolchain -czf development-snapshot/toolchain.tar.gz bin lib
          cp compiler/oxcaml/_build/blotc development-snapshot/blotc
          du -h development-snapshot/*
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[dev-snapshot]'))
        with:
          name: oxcaml-development-snapshot
          path: development-snapshot/
          retention-days: 3
