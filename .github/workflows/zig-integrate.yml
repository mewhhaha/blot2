name: Zig source integration

on:
  push:
    branches: [zig-compiler-rebuild]
    paths: ['.github/workflows/zig-integrate.yml']

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: zig-source-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'mewhhaha/blot2' && github.ref == 'refs/heads/zig-compiler-rebuild'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and import the tested source commits
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat .github/zig-import/part-{0,1,2,3,4,5} > "$RUNNER_TEMP/zig-update.bundle"
          echo "945c6a3133bb20fee13bc3e2b061604dadd1a59dec6fb30f4fe4012ce16946ad  $RUNNER_TEMP/zig-update.bundle" | sha256sum --check
          git bundle verify "$RUNNER_TEMP/zig-update.bundle"
          git fetch "$RUNNER_TEMP/zig-update.bundle" refs/heads/zig-syntax-update
          test "$(git rev-parse FETCH_HEAD)" = 2fdb8762d7bd5c66a2e089f25adc5a7c6df6f5d0
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = 8aa7dc3ab91d01fe65b115a19017dd76e3540588
          git merge-base --is-ancestor 8c833749b11eb310c4cf394e9afdbdee527ba778 FETCH_HEAD
          git merge-base --is-ancestor 5c2640493987c4b8c2335b7b05ad99b654689ac4 FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit FETCH_HEAD
          git rm -r .github/zig-import .github/workflows/zig-integrate.yml
          git diff --cached --check
          test "$(git write-tree)" = 8aa7dc3ab91d01fe65b115a19017dd76e3540588
          test ! -e .github/workflows/zig-source-sync.yml
          test ! -e .github/workflows/zig-bend-reference.yml
          git commit -m 'Merge current main syntax and validated native Zig fast paths'
          git show --stat --oneline HEAD
      - name: Publish only to the Zig PR branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/zig-compiler-rebuild | cut -f1)" = "$GITHUB_SHA"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/zig-compiler-rebuild
