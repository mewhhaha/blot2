name: Zig compiler
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-${{ github.ref }}
  cancel-in-progress: true
env:
  # Reviewed release from this revision, including its patched Zig backend.
  # Bump the archive and checksum together when adopting new lint rules.
  ZIG_ANALYZER_COMMIT: 756bfd5c3e94b2197b08ce79ce1e7b5d110c0508
  ZIG_ANALYZER_VERSION: 0.17.0-1
  ZIG_ANALYZER_SHA256: 398b48dfbf71cf7eba40cfff277db5b1680c701feffa2fdbe3178dcf525c94d3
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Zig 0.17.0
        shell: bash
        run: |
          curl --fail --location --retry 3 https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-native/.zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('zig-native/**/*.zig', 'zig-native/build.zig') }}
          restore-keys: zig-${{ runner.os }}-
      - name: Cache zig-analyzer
        id: analyzer
        uses: actions/cache@v4
        with:
          path: ~/.cache/blot-tools/zig-analyzer-${{ env.ZIG_ANALYZER_VERSION }}-x86_64-linux
          key: zig-analyzer-${{ runner.os }}-${{ env.ZIG_ANALYZER_COMMIT }}-${{ env.ZIG_ANALYZER_SHA256 }}
      - name: Install zig-analyzer
        if: steps.analyzer.outputs.cache-hit != 'true'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/zig-analyzer.tar.xz"
          curl --fail --location --retry 3 "https://github.com/mewhhaha/zig-analyzer/releases/download/v$ZIG_ANALYZER_VERSION/zig-analyzer-$ZIG_ANALYZER_VERSION-x86_64-linux.tar.xz" -o "$archive"
          printf '%s  %s\n' "$ZIG_ANALYZER_SHA256" "$archive" | sha256sum --check
          mkdir -p "$HOME/.cache/blot-tools"
          tar -xJf "$archive" -C "$HOME/.cache/blot-tools"
      - name: Verify zig-analyzer
        shell: bash
        run: |
          analyzer="$HOME/.cache/blot-tools/zig-analyzer-$ZIG_ANALYZER_VERSION-x86_64-linux/bin/zig-analyzer"
          "$analyzer" doctor
          echo "ZIG_ANALYZER=$analyzer" >> "$GITHUB_ENV"
      - run: deno task check
      - run: deno publish --dry-run --allow-dirty
