name: Native typed core
on:
  push:
    branches: [redesign/typed-compiler-core]
    paths: ['compiler/**', 'scripts/**', 'std/**', 'baba.json', 'deno.json', 'deno.lock', '.github/workflows/core-native.yml']
  pull_request:
    paths: ['compiler/**', 'scripts/**', 'std/**', 'baba.json', 'deno.json', 'deno.lock', '.github/workflows/core-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3.0'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Build committed native source
        run: |
          mkdir -p build/core
          git rev-parse HEAD > build/core/revision.txt
          opam exec -- ocamlopt -config > build/core/toolchain.txt
          opam exec -- python3 compiler/core/build.py -j 2 2>&1 | tee build/core/build.log
          deno task generate:parser
      - name: Native storage, concurrency and framing
        run: |
          opam exec -- python3 compiler/core/test_native.py 2>&1 | tee build/core/native.log
          python3 compiler/core/test_transport.py compiler/core/_build/blotc 2>&1 | tee build/core/transport.log
      - name: Test clean builds and source compilation without a JS compiler
        run: |
          opam exec -- python3 compiler/core/test_build.py 2>&1 | tee build/core/build-tests.log
          python3 compiler/core/test_no_reference.py 2>&1 | tee build/core/no-reference.log
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Build the matching pinned Bend compatibility oracle
        run: |
          curl -fL --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.34/bend-2.0.34-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tar.gz"
          echo "78106a97af242429dcc057258eb8d10f69cddebcd5e263022185a52d003e09bf  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend"
          export PATH="$RUNNER_TEMP/bend/bend/bin:$PATH"
          export BEND_NO_TELEMETRY=1
          python3 scripts/build_compiler_reference.py 2>&1 | tee build/core/reference.log
      - name: Run unchanged source and native compatibility tests
        run: |
          python3 compiler/core/test_existing.py --report build/core/parity.json 2>&1 | tee build/core/parity.log
          deno run --allow-all compiler/core/corpus.ts compiler/core/_build/blotc 4 build/core/corpus.json 2>&1 | tee build/core/corpus.log
      - name: Verify real inference constraints against the type graph
        run: |
          python3 compiler/core/test_existing.py --verify-type-graph --report build/core/graph-parity.json 2>&1 | tee build/core/graph-parity.log
      - name: Package exact build and logs
        if: always()
        run: |
          shopt -s nullglob
          python3 compiler/core/checkpoint.py --output build/core/checkpoint.zip --evidence build/core/*.log build/core/*.json build/core/revision.txt build/core/toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-core-${{ github.sha }}
          path: |
            build/core/
            compiler/core/_build/build-manifest.json
          retention-days: 30
          if-no-files-found: error
