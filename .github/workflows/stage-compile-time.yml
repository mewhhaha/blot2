name: Validate compile-time changes
on:
  push:
    branches: [perf/compile-time]
    paths: [.github/workflows/stage-compile-time.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/perf/compile-time'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply exact source patch and symbol-map call-site migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          # Index metadata is optional in unified diffs. Hash the actual hunks.
          raw = Path('.compile-time.patch').read_text()
          patch = ('\n'.join(line for line in raw.splitlines() if not line.startswith('index ')) + '\n').encode()
          assert hashlib.sha256(patch).hexdigest() == 'ee8ffd0d65726d759812ec469c846766da37e84c6d310b6eece850f2c8b67e91'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          count = 0
          for path in Path('compiler').glob('*.bend'):
              if path.name == 'index.bend' or path.name.endswith('_regression.bend'):
                  continue
              text = path.read_text()
              found = text.count('Map.set(&2,')
              if not found:
                  continue
              count += found
              text = text.replace('Map.set(&2, ', 'Index.set(')
              if 'import ./index.bend as Index' not in text:
                  text = text.replace('import Base\n', 'import Base\nimport ./index.bend as Index\n', 1)
              path.write_text(text)
          assert count == 94, count
          PY
          git diff --check
          deno fmt compiler/index_insert.test.ts compiler/inference_fast_paths.test.ts
      - name: Install verified Bend
        run: |
          curl -fL --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tar.gz"
          echo "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bend/bin" >> "$GITHUB_PATH"
      - name: Prove and rebuild exact reference
        run: |
          mkdir -p build
          bend version | tee build/compile-toolchain.txt
          bend guide > build/compile-guide.txt
          deno task generate:parser
          python3 scripts/build_compile_reference.py 2>&1 | tee build/compile-reference.log
      - name: Differential map and inference checks
        run: |
          deno test --allow-read=compiler,generated,examples,std compiler/index_insert.test.ts compiler/inference_fast_paths.test.ts compiler/index.test.ts compiler/substitution.test.ts compiler/annotation_scope.test.ts compiler/effect_inference.test.ts compiler/effect_rows.test.ts 2>&1 | tee build/compile-targeted-tests.log
      - name: Publish validated sources on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler LAWS.bend PROOF.bend
          git rm .compile-time.patch
          git commit -m 'perf: avoid repeated symbol-map traversal and trivial inference work'
          git push origin HEAD:refs/heads/perf/compile-time
          git rev-parse HEAD > build/compile-source.txt
      - name: Archive exact source and generated reference
        if: always()
        run: tar -czf "$RUNNER_TEMP/compile-candidate.tar.gz" compiler generated std scripts examples deno.json deno.lock baba.json AGENTS.md LAWS.bend PROOF.bend build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-compile-candidate
          path: ${{ runner.temp }}/compile-candidate.tar.gz
          retention-days: 3
