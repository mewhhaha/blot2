name: Compile-time baseline
on:
  push:
    branches: [perf/compile-time]
    paths: [.github/workflows/compile-time-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac59fb68f98780e168ce01fa39410b1a6ef54efd
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Install verified Bend
        run: |
          curl -fL --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tar.gz"
          echo "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bend/bin" >> "$GITHUB_PATH"
      - name: Build the unchanged baseline
        run: |
          mkdir -p build
          bend version | tee build/baseline-toolchain.txt
          clang --version >> build/baseline-toolchain.txt
          deno --version >> build/baseline-toolchain.txt
          git rev-parse HEAD > build/baseline-source.txt
          bend guide > build/bend-guide.txt
          deno task build:compiler
          sha256sum generated/compiler/blotc > build/baseline-executable.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compile-time-native-baseline
          path: |
            generated/compiler/blotc
            build/
          retention-days: 7
