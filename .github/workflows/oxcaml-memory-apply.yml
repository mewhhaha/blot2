name: Apply tested OxCaml memory pass
on:
  push:
    branches: [rebuild/oxcaml-compiler]
    paths:
      - 'compiler/oxcaml/bootstrap/memory-pass.*'
      - '.github/workflows/oxcaml-memory-apply.yml'
permissions:
  contents: read
concurrency:
  group: oxcaml-memory-apply
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  apply:
    if: github.repository == 'mewhhaha/blot2' && github.ref == 'refs/heads/rebuild/oxcaml-compiler'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact baseline and reviewed source patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p validation
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          root = Path('compiler/oxcaml/bootstrap')
          allowed = {'.github/workflows/oxcaml-memory-apply.yml',
                     *(str(root / ('memory-pass.' + suffix)) for suffix in ('0.b64', '1.b64', 'sha256.json'))}
          changed = subprocess.check_output(['git', 'diff', '--name-only', '29bc94d0320d1ca35c47ee7b3695e587a01a8daf', 'HEAD'], text=True).splitlines()
          if not set(changed) <= allowed:
              raise RuntimeError('The compiler changed since the reviewed baseline; do not overwrite it')
          encoded = ''.join((root / f'memory-pass.{i}.b64').read_text().strip() for i in range(2))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '73bfc60dc7a21e668fd7d98a6ffd3b6bc2e6406f6a0c6efd13862c9f8be6015e':
              raise RuntimeError('Reviewed patch checksum mismatch')
          manifest = json.loads((root / 'memory-pass.sha256.json').read_text())
          if not all(p.startswith('compiler/oxcaml/') or p == '.github/workflows/oxcaml.yml' for p in manifest):
              raise RuntimeError('Source scope mismatch')
          for args in (['git', 'apply', '--check', '--index', '--unidiff-zero', '-'],
                       ['git', 'apply', '--index', '--unidiff-zero', '-']):
              subprocess.run(args, input=patch, check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if set(actual) != set(manifest):
              raise RuntimeError('Applied paths differ from the reviewed manifest')
          for name, expected in manifest.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise RuntimeError('Source hash mismatch: ' + name)
          Path('validation/source.patch').write_bytes(patch)
          Path('validation/source-sha256.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('Verified all', len(manifest), 'native source/test/workflow files')
          PY
      - run: sudo apt-get update && sudo apt-get install -y opam autoconf build-essential
      - uses: actions/cache@v4
        with:
          path: ~/.opam
          key: oxcaml-5.2.0-ox-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install OxCaml
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0
          opam init --bare --disable-sandboxing -y
          if ! opam switch list --short | grep -Fxq 5.2.0+ox; then
            opam switch create 5.2.0+ox --repos ox=git+https://github.com/oxcaml/opam-repository.git,default -y
          fi
          opam exec --switch 5.2.0+ox -- ocamlopt -config
      - name: Test the exact source before publishing
        run: opam exec --switch 5.2.0+ox -- make -C compiler/oxcaml test test-build bench-names 2>&1 | tee validation/native-tests.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check standalone compilation and measurement harness
        run: |
          test ! -f generated/compiler/compiler.js
          deno fmt --check compiler/oxcaml/README.md compiler/oxcaml/MEMORY_CONCURRENCY.md compiler/oxcaml/memory_fixtures.ts
          deno run --allow-all compiler/oxcaml/smoke.ts 2>&1 | tee validation/smoke.txt
          deno run --allow-all compiler/oxcaml/memory_fixtures.ts validation/frames
          python3 compiler/oxcaml/bench_frames.py compiler/oxcaml/_build/blotc compiler/oxcaml/_build/blotc validation/frames validation/rss-smoke.json --samples 1 --requests 1 --threads 1
      - name: Publish tested source and remove this one-time writer
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/rebuild/oxcaml-compiler | cut -f1)" = "$EXPECTED_HEAD"
          git diff --exit-code
          git rm .github/workflows/oxcaml-memory-apply.yml compiler/oxcaml/bootstrap/memory-pass.0.b64 compiler/oxcaml/bootstrap/memory-pass.1.b64 compiler/oxcaml/bootstrap/memory-pass.sha256.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reduce OxCaml representation and transport allocation; retain measured FIFO scheduler'
          git push origin HEAD:rebuild/oxcaml-compiler
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oxcaml-memory-source-validation
          path: validation/
          retention-days: 7
