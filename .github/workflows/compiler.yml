name: Compiler
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: squid-lang
concurrency:
  group: compiler-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: squid-lang
      # Browser kernel and render-copy tests need these public sibling sources.
      - name: Fetch pinned Pen and Ink sources
        shell: bash
        run: |
          fetch_sources() {
            local repo="$1" revision="$2"
            mkdir -p "../$repo"
            curl --fail --silent --show-error --location --retry 3 \
              "https://codeload.github.com/mewhhaha/$repo/tar.gz/$revision" \
              | tar -xz --strip-components=1 -C "../$repo"
          }
          fetch_sources pen b301f55cc94620a409444ffd001b490844c7886e
          fetch_sources ink 46287c5fb4e7d7b1ae740c9443088afff5f1cb64
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install compiler build and test tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang wabt
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('squid-lang/deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      # The compiler is written in Goose and compiled with goosew (mewhhaha/goose-to-wasm).
      - name: Cache goosew toolchain
        uses: actions/cache@v4
        with:
          path: squid-lang/compiler-goose/build/goosew
          key: goosew-${{ runner.os }}-${{ runner.arch }}-v2026.4-8
      - run: deno task check
      - run: deno publish --dry-run --allow-dirty
