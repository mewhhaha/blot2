name: Validate Bend checked handoff
on:
  push:
    branches: [redesign/typed-compiler-core]
    paths: [.github/workflows/bend-handoff-stage.yml]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  checkpoint:
    if: github.ref == 'refs/heads/redesign/typed-compiler-core'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply checksum-verified Bend source changes
        run: |
          echo '60792a29be3a1caca2b8a9fee8a57b17ea477829eb4ef965213c75a869c631c4  scripts/bend-checked-handoff.patch' | sha256sum -c -
          git apply --check scripts/bend-checked-handoff.patch
          git apply scripts/bend-checked-handoff.patch
          git diff --check
      - name: Install exact Bend release
        run: |
          curl -fL --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.34/bend-2.0.34-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tar.gz"
          echo "78106a97af242429dcc057258eb8d10f69cddebcd5e263022185a52d003e09bf  $RUNNER_TEMP/bend.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bend/bin" >> "$GITHUB_PATH"
      - name: Prove modified Bend source
        run: |
          mkdir -p build/handoff
          bend version | tee build/handoff/toolchain.txt
          deno --version >> build/handoff/toolchain.txt
          bun --version >> build/handoff/toolchain.txt
          bend guide > build/handoff/bend-guide.txt
          bend PROOF.bend 2>&1 | tee build/handoff/proofs.log
          deno fmt --check compiler/checked_handoff.test.ts
      - name: Publish proof-checked implementation checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler/checked_core.bend compiler/check_scheduler.bend compiler/monomorph.bend compiler/main.bend compiler/checked_handoff.test.ts LAWS.bend PROOF.bend
          git rm scripts/bend-checked-handoff.patch .github/workflows/bend-handoff-stage.yml
          git commit -m 'perf: carry unchanged checked Bend modules across finalization'
          git push origin HEAD:refs/heads/redesign/typed-compiler-core
          git rev-parse HEAD > build/handoff/revision.txt
          git archive --format=tar.gz HEAD > build/handoff/source.tar.gz
          sha256sum build/handoff/source.tar.gz > build/handoff/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: bend-handoff-source
          path: build/handoff/
          retention-days: 30
      - name: Build exact official JavaScript reference
        run: |
          bend version
          python3 scripts/build_compiler_reference.py
          deno task generate:parser
          tar -czf "$RUNNER_TEMP/handoff-reference.tar.gz" compiler generated std examples scripts deno.json deno.lock baba.json AGENTS.md LAWS.bend PROOF.bend
      - uses: actions/upload-artifact@v4
        with:
          name: bend-handoff-reference
          path: ${{ runner.temp }}/handoff-reference.tar.gz
          retention-days: 7
      - name: Test checked handoff and existing evidence boundaries
        run: |
          deno test --allow-read=compiler,generated,examples,std compiler/checked_handoff.test.ts compiler/checked_core_pipeline.test.ts compiler/field_core_regression.test.ts compiler/schema_evaluation.test.ts 2>&1 | tee build/handoff/focused-tests.log
      - name: Build exact Bend native compiler
        run: |
          bend version
          deno task build:compiler 2>&1 | tee build/handoff/native-build.log
          sha256sum generated/compiler/blotc > build/handoff/executable.sha256
      - name: Complete native and reference regression suite
        run: |
          deno test --allow-read=compiler,generated,examples,std,scripts --allow-run=generated/compiler/blotc,chrt,nice,ionice,ps,prlimit,setsid compiler/*.test.ts 2>&1 | tee build/handoff/all-tests.log
      - uses: actions/download-artifact@v4
        with:
          name: typed-core-baseline
          run-id: 36562391576
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/baseline-archive
      - name: Compare complete source compilation against merged main
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          tar -xzf "$RUNNER_TEMP/baseline-archive/typed-core-baseline.tar.gz" -C "$RUNNER_TEMP/baseline"
          chmod +x "$RUNNER_TEMP/baseline/generated/compiler/blotc"
          cp "$RUNNER_TEMP/baseline/generated/compiler/source-revision.txt" build/handoff/baseline-revision.txt
          sha256sum "$RUNNER_TEMP/baseline/generated/compiler/blotc" > build/handoff/baseline-executable.sha256
          deno run --allow-all compiler/compile_time_bench.ts "$RUNNER_TEMP/baseline/generated/compiler/blotc" generated/compiler/blotc build/handoff/compile-times.json 7 1,4 2>&1 | tee build/handoff/compile-times.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-handoff-validation
          path: |
            build/handoff/
            generated/compiler/blotc
          retention-days: 30
