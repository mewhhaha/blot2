name: Layout propagation
on:
  pull_request:
    paths: ['compiler/**', 'scripts/**', 'std/**', 'LAWS.bend', 'PROOF.bend', 'deno.json', 'deno.lock', '.github/workflows/layout-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: layout-performance-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: [before, candidate]
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - name: Install verified matching Bend toolchain
        run: |
          curl --fail --location --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tar.gz"
          echo "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  $RUNNER_TEMP/bend.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bend/bin" >> "$GITHUB_PATH"
      - name: Build exact source
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          bend version
          bend guide > "$RUNNER_TEMP/bend-guide.txt"
          source="$GITHUB_WORKSPACE"
          if [ "$REVISION" = before ]; then
            source="$RUNNER_TEMP/before"
            git worktree add --detach "$source" f46baf4983a34ecb7fe3845c02eefd7fbe162059
          fi
          python3 "$GITHUB_WORKSPACE/scripts/build_runtime_reference.py" "$source"
          (cd "$source" && deno task generate:parser)
          git -C "$source" rev-parse HEAD > "$source/generated/compiler/source-revision.txt"
          tar -czf "$RUNNER_TEMP/$REVISION.tar.gz" -C "$source" compiler generated std scripts deno.json deno.lock baba.json
      - uses: actions/upload-artifact@v4
        with:
          name: layout-${{ matrix.revision }}
          path: ${{ runner.temp }}/${{ matrix.revision }}.tar.gz
          retention-days: 3
  measure:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v4
        with:
          name: layout-before
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: layout-candidate
          path: ${{ runner.temp }}
      - name: Restore and check layout propagation
        run: |
          mkdir -p "$RUNNER_TEMP/before" build
          tar -xzf "$RUNNER_TEMP/before.tar.gz" -C "$RUNNER_TEMP/before"
          tar -xzf "$RUNNER_TEMP/candidate.tar.gz"
          deno fmt --check compiler/codegen_layout.test.ts compiler/layout_propagation.test.ts compiler/layout_bench.ts compiler/LAYOUT_PROPAGATION.md
          deno check compiler/layout_bench.ts
          deno test --allow-read=compiler,generated,examples,std compiler/codegen_layout.test.ts compiler/codegen.test.ts 2>&1 | tee build/layout-unit.log
          deno test --allow-read=compiler,generated,examples,std --filter javascript compiler/layout_propagation.test.ts 2>&1 | tee build/layout-source.log
      - name: Compare with previously verified scalar-array implementation
        run: |
          deno run --allow-read --allow-write=build compiler/layout_bench.ts "$RUNNER_TEMP/before" 2>&1 | tee build/layout-bench.log
          cp generated/compiler/source-revision.txt build/candidate-revision.txt
          cp "$RUNNER_TEMP/before/generated/compiler/source-revision.txt" build/before-revision.txt
          cp generated/compiler/runtime-reference-version.txt build/bend-version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-results
          path: build/
          retention-days: 7
