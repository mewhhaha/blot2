name: Zig offline development kit

on:
  pull_request:
    paths:
      - '.github/workflows/zig-devkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package tracked source and checksum-verified development tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zig-devkit"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/zig-devkit/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/zig-devkit/source-commit.txt"
          cd "$RUNNER_TEMP/zig-devkit"
          curl --fail --location --retry 3 -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz' | sha256sum --check
          curl --fail --location --retry 3 -o zig-analyzer.tar.xz https://github.com/mewhhaha/zig-analyzer/releases/download/v0.16.0-4/zig-analyzer-0.16.0-4-x86_64-linux.tar.xz
          echo 'f40a5e290906c9047d01a1256d99e006bd56d84f56c030a9f60a7bcfb5912634  zig-analyzer.tar.xz' | sha256sum --check
          curl --fail --location --retry 3 -o bend.tar.gz https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz
          echo '5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  bend.tar.gz' | sha256sum --check
          sha256sum *.tar.* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zig-offline-devkit
          path: ${{ runner.temp }}/zig-devkit/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
