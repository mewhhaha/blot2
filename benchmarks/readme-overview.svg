<svg xmlns="http://www.w3.org/2000/svg" width="920" height="342" viewBox="0 0 920 342" role="img" aria-labelledby="title desc">
  <title id="title">Squid benchmark results</title>
  <desc id="desc">Each bar shows Squid's time or memory as a percentage of the named baseline. On the 16-benchmark Goose suite, Squid takes 1.07 times the runtime and uses 0.87 times the peak memory of expert C++. On 12 PLB problems, Squid is 2.18 times faster than Go. A cold native build takes 28 milliseconds, 8.2 times faster than clang++. All comparisons use geometric means.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #192924; }
    .heading { font-size: 25px; font-weight: 700; }
    .label { font-size: 17px; font-weight: 650; }
    .detail, .tick { font-size: 14px; fill: #435b52; }
    .tick { text-anchor: middle; }
    .value { font-size: 20px; font-weight: 700; }
    .bar { fill: #e35424; }
  </style>
  <rect width="920" height="342" rx="14" fill="#f4f8f5"/>
  <text x="24" y="39" class="heading">Squid benchmark results</text>
  <text x="24" y="65" class="detail">Geometric means · Shorter bars mean less time or memory.</text>

  <!-- The common scale uses 4 SVG units per percentage point. -->
  <path d="M264 106v210 M464 106v210" stroke="#c4d2cb"/>
  <path d="M664 106v210" stroke="#426958" stroke-width="2" stroke-dasharray="4 4"/>
  <g class="tick">
    <text x="264" y="98">0%</text>
    <text x="464" y="98">50%</text>
    <text x="664" y="98">100% baseline</text>
  </g>

  <g transform="translate(0 131)">
    <text x="24" class="label">Runtime</text>
    <text x="24" y="20" class="detail">Goose suite · 16 benchmarks</text>
    <rect x="264" y="-7" width="426.4" height="16" rx="3" class="bar"/>
    <text x="732" class="value">1.07×</text>
    <text x="732" y="20" class="detail">expert C++ time</text>
  </g>
  <g transform="translate(0 187)">
    <text x="24" class="label">Runtime</text>
    <text x="24" y="20" class="detail">PLB · 12 problems</text>
    <rect x="264" y="-7" width="183.49" height="16" rx="3" class="bar"/>
    <text x="732" class="value">2.18× faster</text>
    <text x="732" y="20" class="detail">than Go</text>
  </g>
  <g transform="translate(0 243)">
    <text x="24" class="label">Peak memory</text>
    <text x="24" y="20" class="detail">Goose suite · 16 benchmarks</text>
    <rect x="264" y="-7" width="346" height="16" rx="3" class="bar"/>
    <text x="732" class="value">0.87×</text>
    <text x="732" y="20" class="detail">expert C++ peak RSS</text>
  </g>
  <g transform="translate(0 299)">
    <text x="24" class="label">Cold build to native</text>
    <text x="24" y="20" class="detail">Goose suite · 16 benchmarks</text>
    <rect x="264" y="-7" width="48.69" height="16" rx="3" class="bar"/>
    <text x="732" class="value">28 ms</text>
    <text x="732" y="20" class="detail">8.2× faster than clang++</text>
  </g>
</svg>
