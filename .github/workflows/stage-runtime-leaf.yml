name: Validate scalar-array collector
on:
  push:
    branches: [perf/runtime-data-paths]
    paths: [.github/workflows/stage-runtime-leaf.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    if: github.ref == 'refs/heads/perf/runtime-data-paths'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - name: Apply exact reviewed source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          patch = gzip.decompress(base64.b64decode(Path('.runtime-leaf.patch.gz.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '36baaa6f95b935c7c4bc49d64bd215fd4cc022a2b1168db627e2742a24de346a'
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          PY
          git diff --check
      - name: Install exact Bend and WABT
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          curl -fL --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tar.gz"
          echo "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  $RUNNER_TEMP/bend.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bend/bin" >> "$GITHUB_PATH"
      - name: Regenerate runtime and prove modified source
        run: |
          bend version
          wat2wasm --version
          bend guide > "$RUNNER_TEMP/bend-guide.txt"
          deno run -A scripts/generate_arena_runtime.ts
          bend PROOF.bend
          deno fmt --check compiler/gc_bench.ts compiler/scalar_array_layout.test.ts compiler/arena_runtime.test.ts compiler/RUNTIME_PERFORMANCE.md scripts/generate_arena_runtime.ts
      - name: Build candidate reference from modified source
        run: |
          python3 scripts/build_runtime_reference.py
          deno task generate:parser
          mkdir -p build
          git diff > build/source.patch
          tar -czf "$RUNNER_TEMP/staged-candidate.tar.gz" compiler generated std scripts deno.json deno.lock baba.json LAWS.bend PROOF.bend
      - uses: actions/upload-artifact@v4
        with:
          name: staged-scalar-candidate
          path: ${{ runner.temp }}/staged-candidate.tar.gz
          retention-days: 3
      - name: Test exact runtime and compiler-emitted layouts
        run: |
          set -o pipefail
          deno test --allow-read=compiler,generated,examples,std compiler/arena_runtime.test.ts 2>&1 | tee build/arena-tests.log
          deno test --allow-read=compiler,generated,examples,std --filter javascript compiler/scalar_array_layout.test.ts 2>&1 | tee build/layout-tests.log
      - uses: actions/download-artifact@v4
        with:
          name: runtime-candidate
          run-id: 36423055592
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-artifact
      - name: Compare against previously validated PR implementation
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          tar -xzf "$RUNNER_TEMP/previous-artifact/candidate.tar.gz" -C "$RUNNER_TEMP/previous"
          deno run --allow-read --allow-write=build compiler/gc_bench.ts "$RUNNER_TEMP/previous" 2>&1 | tee build/gc-bench.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staged-scalar-results
          path: build/
          retention-days: 7
      - name: Publish validated changes on performance branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler scripts LAWS.bend PROOF.bend
          git rm .runtime-leaf.patch.gz.b64 .github/workflows/stage-runtime-leaf.yml .github/workflows/runtime-dev-tools.yml
          git diff --cached --check
          git commit -m 'perf: skip tracing proven scalar arrays and bulk-clear collector bitmap'
          git push origin HEAD:refs/heads/perf/runtime-data-paths
