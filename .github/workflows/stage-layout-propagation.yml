name: Validate layout propagation
on:
  push:
    branches: [perf/runtime-data-paths]
    paths: [.github/workflows/stage-layout-propagation.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/perf/runtime-data-paths'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BEND_NO_TELEMETRY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - name: Apply checksum-verified source changes
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(Path('.layout-propagation.patch.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0bf7aa6c1bad11c4de699aa2af08e6cfe5c1ab1695bc8f974172ae6d8245dcdc'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          proof = Path('PROOF.bend')
          text = proof.read_text()
          for name in ['layout_unknown_join_is_conservative', 'layout_array_pointer_is_not_scalar', 'layout_unknown_fields_are_not_empty_scalars']:
              old = f'def Laws.{name}:'
              assert text.count(old) == 1
              text = text.replace(old, f'def Laws.{name}():')
          proof.write_text(text)
          PY
          git diff --check
      - name: Install verified Bend release
        run: |
          curl --fail --location --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tar.gz"
          echo "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  $RUNNER_TEMP/bend.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bend/bin" >> "$GITHUB_PATH"
      - name: Verify proofs and build exact candidate
        run: |
          bend version
          bend guide > "$RUNNER_TEMP/bend-guide.txt"
          deno --version
          bun --version
          deno task generate:parser
          python3 scripts/build_runtime_reference.py
          tar -czf "$RUNNER_TEMP/layout-candidate.tar.gz" compiler generated std scripts deno.json deno.lock baba.json LAWS.bend PROOF.bend
      - uses: actions/upload-artifact@v4
        with:
          name: layout-candidate
          path: ${{ runner.temp }}/layout-candidate.tar.gz
          retention-days: 3
      - name: Check emitter and representation regressions
        run: |
          deno fmt --check compiler/codegen_layout.test.ts
          deno test --allow-read=compiler,generated,examples,std compiler/codegen_layout.test.ts compiler/codegen.test.ts
          deno test --allow-read=compiler,generated,examples,std --filter javascript compiler/scalar_array_layout.test.ts
      - name: Publish checked changes to isolated performance branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler/wasm.bend compiler/codegen_layout.bend compiler/codegen_layout.test.ts LAWS.bend PROOF.bend
          git rm .layout-propagation.patch.b64
          git commit -m 'perf: propagate scalar layouts through lexical bindings and aggregate fields'
          git push origin HEAD:refs/heads/perf/runtime-data-paths
