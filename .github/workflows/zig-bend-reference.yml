name: Zig benchmark Bend reference

on:
  pull_request:
    paths:
      - '.github/workflows/zig-bend-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: zig-bend-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      # Pin the main revision used by the tested Zig merge checkout.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ac59fb68f98780e168ce01fa39410b1a6ef54efd
          persist-credentials: false
      - name: Install checksum-verified Bend 2.0.32
        run: |
          mkdir -p "$RUNNER_TEMP/bend-reference"
          cd "$RUNNER_TEMP/bend-reference"
          curl --fail --location --retry 3 --output bend.tar.gz https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz
          echo '5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  bend.tar.gz' | sha256sum --check
          tar -xzf bend.tar.gz
          binary=$(find "$PWD" -type f -name bend -perm -u+x -print -quit)
          test -n "$binary"
          dirname "$binary" >> "$GITHUB_PATH"
      - name: Record exact source and toolchain
        run: |
          mkdir -p build/zig-bend-reference
          git rev-parse HEAD > build/zig-bend-reference/source-commit.txt
          find compiler -maxdepth 1 -type f \( -name '*.bend' -o -name '*.c' -o -name '*.h' \) -print0 | sort -z | xargs -0 sha256sum > build/zig-bend-reference/source-sha256.txt
          bend version > build/zig-bend-reference/toolchain.txt
          clang --version >> build/zig-bend-reference/toolchain.txt
          printf '\nclang -std=c11 -O3 -w -pthread blotc.c -lm -o blotc-bend-O3\n' >> build/zig-bend-reference/toolchain.txt
      - name: Check source proofs and generate unchanged native C
        timeout-minutes: 12
        run: |
          bend PROOF.bend
          /usr/bin/time -v -o build/zig-bend-reference/generate-time.txt bend compiler/native_main.bend -o build/zig-bend-reference/blotc.c
      - name: Build optimized reference with production flags
        timeout-minutes: 16
        run: |
          /usr/bin/time -v -o build/zig-bend-reference/build-time.txt clang -std=c11 -O3 -w -pthread build/zig-bend-reference/blotc.c -lm -o build/zig-bend-reference/blotc-bend-O3
          sha256sum build/zig-bend-reference/blotc.c build/zig-bend-reference/blotc-bend-O3 > build/zig-bend-reference/output-sha256.txt
          build/zig-bend-reference/blotc-bend-O3 --threads 1 < /dev/null > build/zig-bend-reference/handshake.bin
          python3 -c 'import struct; from pathlib import Path; assert Path("build/zig-bend-reference/handshake.bin").read_bytes() == struct.pack("<III", 2, 0x424c4f54, 13)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zig-bend-optimized-reference
          path: build/zig-bend-reference/
          retention-days: 7
          if-no-files-found: error
