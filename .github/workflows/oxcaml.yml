name: OxCaml compiler
on:
  push:
    branches: [rebuild/oxcaml-compiler]
  pull_request:
    paths: ['compiler/**', 'std/**', 'generated/wasm/**', '.github/workflows/oxcaml.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: oxcaml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ocaml-nox
      - run: ocamlopt -version && make -C compiler/oxcaml test
  oxcaml:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y opam autoconf build-essential
      - uses: actions/cache@v4
        with:
          path: ~/.opam
          key: oxcaml-5.2.0-ox-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install OxCaml
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0
          opam init --bare --disable-sandboxing -y
          if ! opam switch list --short | grep -Fxq 5.2.0+ox; then
            opam switch create 5.2.0+ox --repos ox=git+https://github.com/oxcaml/opam-repository.git,default -y
          fi
          opam exec --switch 5.2.0+ox -- ocamlopt -config
      - name: Build checked-in native source with OxCaml
        run: opam exec --switch 5.2.0+ox -- make -C compiler/oxcaml test
      - uses: actions/upload-artifact@v4
        with:
          name: oxcaml-executable
          path: compiler/oxcaml/_build/blotc
          retention-days: 7
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BEND_NO_TELEMETRY: '1'
      DENO_DIR: ${{ github.workspace }}/.reference-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - name: Install verified reference release
        run: |
          mkdir -p reference-tools/bend reference-tools/bin
          curl -fL https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o /tmp/bend.tar.gz
          echo '5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  /tmp/bend.tar.gz' | sha256sum -c -
          tar -xzf /tmp/bend.tar.gz -C reference-tools/bend
          executable="$(find "$PWD/reference-tools/bend" -type f -name bend | head -n1)"
          test -n "$executable"
          chmod +x "$executable"
          echo "$(dirname "$executable")" >> "$GITHUB_PATH"
          cp "$(command -v deno)" "$(command -v bun)" reference-tools/bin/
          deno cache generated/wasm/mod.ts
      - name: Export development dependencies before reference build
        if: github.event_name == 'push'
        run: tar -czf development-tools.tar.gz reference-tools .reference-cache
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: oxcaml-development-tools
          path: development-tools.tar.gz
          retention-days: 3
      - name: Build unchanged reference modules sequentially
        run: python3 compiler/oxcaml/build_reference.py
      - run: tar -czf reference.tar.gz reference-tools .reference-cache generated/compiler
      - uses: actions/upload-artifact@v4
        with:
          name: oxcaml-reference
          path: reference.tar.gz
          retention-days: 3
  parity:
    needs: [oxcaml, reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DENO_DIR: ${{ github.workspace }}/.reference-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: oxcaml-executable
          path: compiler/oxcaml/_build
      - uses: actions/download-artifact@v4
        with:
          name: oxcaml-reference
      - run: |
          tar -xzf reference.tar.gz
          chmod +x compiler/oxcaml/_build/blotc
          echo "$PWD/reference-tools/bin" >> "$GITHUB_PATH"
      - name: Run unchanged native suites against OxCaml
        run: |
          mkdir -p parity-results
          python3 compiler/oxcaml/test_existing.py --report parity-results/manifest.json 2>&1 | tee parity-results/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oxcaml-parity-results
          path: parity-results/
          retention-days: 7
