name: Validate compiler work reduction
on:
  push:
    branches: [perf/compiler-throughput]
    paths: [.github/workflows/stage-compiler-throughput.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  stage:
    if: github.ref == 'refs/heads/perf/compiler-throughput'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - name: Apply and verify exact source changes
        run: |
          git apply --check .compiler-throughput.patch
          git apply .compiler-throughput.patch
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'LAWS.bend': '6c63b8cfb5d23b189fb834d5fb48cc6949ed37636378d716bef2c75fc6424aa1',
            'PROOF.bend': '3cdb4f3b24a636f9e3b1686081431480d8a825e027b393284729833ebee5d1cc',
            'compiler/infer.bend': '5c823ff36fcca255b651a52f9ab9e7d9a767ef0d8ce46e5d56df5f3151152bac',
            'compiler/lower.bend': '470fa87b104d02415454d5d9ed64bd72531ddf1f11ded1de603bf990d3f8a02a',
            'compiler/source_types.bend': '0919b34a54a592484820c1153b325a3590b62141d128e9b1194ea9b9a1c0e10a',
          }
          for file, digest in expected.items():
              actual = hashlib.sha256(Path(file).read_bytes()).hexdigest()
              assert actual == digest, (file, actual, digest)
          PY
      - name: Install verified Bend and prove source
        run: |
          curl -fL --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.34/bend-2.0.34-linux-x64.tar.gz -o /tmp/bend.tar.gz
          echo '78106a97af242429dcc057258eb8d10f69cddebcd5e263022185a52d003e09bf  /tmp/bend.tar.gz' | sha256sum -c -
          mkdir -p /tmp/bend
          tar -xzf /tmp/bend.tar.gz -C /tmp/bend
          export PATH="/tmp/bend/bend/bin:$PATH"
          echo /tmp/bend/bend/bin >> "$GITHUB_PATH"
          bend version
          bend guide > /tmp/bend-guide.txt
          bend PROOF.bend
      - name: Publish proof-checked source on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LAWS.bend PROOF.bend compiler/infer.bend compiler/lower.bend compiler/source_types.bend
          git rm .compiler-throughput.patch
          git commit -m 'perf: skip closed generalization scans and fuse annotation scope traversal'
          git push origin HEAD:refs/heads/perf/compiler-throughput
          git rev-parse HEAD > /tmp/compiler-source-revision.txt
      - name: Build matching reference modules sequentially
        run: |
          mkdir -p generated/compiler/bend-2.0.34
          for file in main.ts bend.ts comp.ts safe.ts base.bend; do
            curl -fL --retry 3 "https://raw.githubusercontent.com/bendlang/bend/v2.0.34/bend2/$file" -o "generated/compiler/bend-2.0.34/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          loader = (root / 'generated/compiler/bend-2.0.34/main.ts').as_uri()
          program = '''const { load } = await import(process.argv[1]);
          const result = await load(process.argv[2], {}, () => { throw new Error("Unrecognized compiler entry"); });
          process.stdout.write(result.source);'''
          for module, name in [('main', 'compiler'), ('native_session', 'native_session'), ('native_output', 'native_output')]:
              with (root / f'generated/compiler/{name}.js').open('wb') as output:
                  subprocess.run(['bun', '--eval', program, loader, (root / f'compiler/{module}.bend').as_uri()], stdout=output, check=True)
          PY
          deno task generate:parser
          cp /tmp/compiler-source-revision.txt generated/compiler/source-revision.txt
          tar -czf /tmp/compiler-candidate-reference.tar.gz compiler generated/compiler generated/wasm std examples deno.json deno.lock
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-candidate-reference
          path: /tmp/compiler-candidate-reference.tar.gz
          retention-days: 3
      - name: Build native candidate from identical source
        run: deno task build:compiler
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-native-candidate
          path: |
            generated/compiler/blotc
            generated/compiler/source-revision.txt
          retention-days: 7
