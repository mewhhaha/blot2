name: OxCaml checked native memory migration
on:
  push:
    branches: [rebuild/oxcaml-memory-staging]
permissions:
  contents: read
concurrency:
  group: oxcaml-memory-staging
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  materialize:
    if: github.ref == 'refs/heads/rebuild/oxcaml-memory-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Stop only the superseded staging run if still active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = 'https://api.github.com/repos/mewhhaha/blot2/actions/runs/36466142748'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              status = json.load(response)['status']
          if status != 'completed':
              try:
                  with urllib.request.urlopen(urllib.request.Request(url + '/cancel', headers=headers, method='POST')):
                      print('Cancelled the superseded staging run')
              except urllib.error.HTTPError as error:
                  if error.code != 409:
                      raise
          PY
      - name: Materialize only the reviewed native word representation
        run: |
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          mkdir -p native-migration-results
          python3 compiler/oxcaml/bootstrap/materialize_words.py | tee native-migration-results/migration.txt
      - uses: actions/download-artifact@v4
        with:
          name: oxcaml-development-snapshot
          run-id: 36457320047
          github-token: ${{ github.token }}
          path: pinned-snapshot
      - name: Select the pinned actual OxCaml used for the local experiments
        run: |
          test "$(cat pinned-snapshot/source.sha)" = '29bc94d0320d1ca35c47ee7b3695e587a01a8daf'
          mkdir -p pinned-toolchain
          tar -C pinned-toolchain -xzf pinned-snapshot/toolchain.tar.gz
          chmod +x pinned-toolchain/bin/ocamlopt
          echo "$PWD/pinned-toolchain/bin" >> "$GITHUB_PATH"
          echo "OCAMLLIB=$PWD/pinned-toolchain/lib/ocaml" >> "$GITHUB_ENV"
          sha256sum pinned-snapshot/toolchain.tar.gz > native-migration-results/toolchain-sha256.txt
      - name: Native semantic, scalar, allocation, concurrency and build checks
        run: |
          ocamlopt -config | tee native-migration-results/compiler.txt
          make -C compiler/oxcaml test test-build | tee native-migration-results/native-tests.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Standalone source and Wasm without the reference compiler
        run: |
          test ! -f generated/compiler/compiler.js
          deno run --allow-all compiler/oxcaml/smoke.ts | tee native-migration-results/smoke.txt
          deno task blot:oxcaml build examples/arrays.blot build/arrays.wasm
      - name: Commit tested native source on the temporary branch only
        run: |
          git add compiler/oxcaml/core compiler/oxcaml/ox_native_transport.ml compiler/oxcaml/test_names.ml compiler/oxcaml/test_runtime.ml compiler/oxcaml/bench_names.ml compiler/oxcaml/test_build.py compiler/oxcaml/test_existing.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize hash-verified typed immediate words in the native compiler'
          git push origin HEAD:rebuild/oxcaml-memory-staging
          git rev-parse HEAD > native-migration-results/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oxcaml-native-migration-results
          path: native-migration-results/
          retention-days: 7
