name: Compiler
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install the compiler's build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      # The compiler is written in Goose; its build first builds upstream Goose
      # with the patch series in compiler-goose/tools/upstream-32a4f44.
      - name: Cache the patched Goose compiler
        uses: actions/cache@v4
        with:
          path: build/goose-port
          key: goose-${{ runner.os }}-${{ hashFiles('compiler-goose/tools/upstream-32a4f44/**') }}
      - run: deno task check
      - run: deno publish --dry-run --allow-dirty
