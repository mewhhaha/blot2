name: Zig IR inputs
on:
  push:
    branches: [zig-compiler-rebuild]
    paths: ['.github/workflows/zig-ir-inputs.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export exact source
        run: |
          mkdir -p "$RUNNER_TEMP/zig-ir-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/zig-ir-inputs/revision.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/zig-ir-inputs/source.tar"
          cd "$RUNNER_TEMP/zig-ir-inputs"
          sha256sum source.tar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zig-ir-inputs
          path: ${{ runner.temp }}/zig-ir-inputs/
          retention-days: 1
          if-no-files-found: error
