name: Zig migration bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/zig-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch verified Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zig-bootstrap"
          cd "$RUNNER_TEMP/zig-bootstrap"
          curl --fail --location --retry 3 --output zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz' | sha256sum --check
          tar -xf zig.tar.xz
          ./zig-x86_64-linux-0.16.0/zig version
          rm -rf zig-x86_64-linux-0.16.0
      - name: Snapshot tracked source for offline development
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/zig-bootstrap/source.tar.gz"
          find compiler -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zig-bootstrap
          path: ${{ runner.temp }}/zig-bootstrap/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
