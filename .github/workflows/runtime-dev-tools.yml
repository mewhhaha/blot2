name: Runtime development tools
on:
  push:
    branches: [perf/runtime-data-paths]
    paths: [.github/workflows/runtime-dev-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install WABT
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt
          mkdir tools
          cp "$(command -v wat2wasm)" "$(command -v wasm2wat)" tools/
          wat2wasm --version > tools/version.txt
          ldd tools/wat2wasm > tools/libraries.txt
          tar -czf runtime-wabt.tar.gz tools
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-wabt
          path: runtime-wabt.tar.gz
          retention-days: 3
