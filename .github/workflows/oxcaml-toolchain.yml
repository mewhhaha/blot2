name: OxCaml development toolchain
on:
  push:
    branches: [rebuild/oxcaml-compiler]
    paths: ['.github/workflows/oxcaml-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - run: sudo apt-get update && sudo apt-get install -y opam autoconf build-essential
      - uses: actions/cache@v4
        with:
          path: ~/.opam
          key: oxcaml-5.2.0-ox-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Prepare compiler
        shell: bash
        run: |
          set -euo pipefail
          git config --global maintenance.auto false
          git config --global gc.auto 0
          opam init --bare --disable-sandboxing -y
          if ! opam switch list --short | grep -Fxq 5.2.0+ox; then
            opam switch create 5.2.0+ox --repos ox=git+https://github.com/oxcaml/opam-repository.git,default -y
          fi
          opam exec --switch 5.2.0+ox -- ocamlopt -config > compiler-config.txt
          prefix="$(opam var --switch 5.2.0+ox prefix)"
          tar -czf oxcaml-toolchain.tar.gz -C "$prefix" bin lib/ocaml
      - uses: actions/upload-artifact@v4
        with:
          name: oxcaml-development-toolchain
          path: |
            oxcaml-toolchain.tar.gz
            compiler-config.txt
          retention-days: 3
