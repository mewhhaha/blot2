name: Core checkpoint
on:
  push:
    branches: [redesign/typed-compiler-core]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact checkpoint
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/core-source.tar.gz"
          sha256sum "$RUNNER_TEMP/core-source.tar.gz" > "$RUNNER_TEMP/source-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: core-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/core-source.tar.gz
            ${{ runner.temp }}/source-revision.txt
            ${{ runner.temp }}/source-sha256.txt
          retention-days: 30
          if-no-files-found: error
