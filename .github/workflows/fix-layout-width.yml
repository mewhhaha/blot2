name: Validate wide layout traversal
on:
  push:
    branches: [perf/runtime-data-paths]
    paths: [.github/workflows/fix-layout-width.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/perf/runtime-data-paths'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BEND_NO_TELEMETRY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - name: Replace eager sibling recursion with a tail accumulator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('compiler/wasm.bend')
          old = '''def scalar_words_in(elements: List<&2, I.Expr>, +context: Context) -> Bool:
            match elements:
              case Nil{}:
                True{}
              case head <> tail:
                Bool.and(scalar_word_in(head, context), scalar_words_in(tail, context))
          '''
          new = '''# Sibling width must not consume the host stack. Short-circuiting this pure
          # classification does not skip evaluation of any emitted array operand.
          def scalar_words_in_go(elements: List<&2, I.Expr>, +context: Context, scalars: Bool) -> Bool:
            match elements scalars:
              case _ False{}:
                False{}
              case Nil{} True{}:
                True{}
              case head <> tail True{}:
                scalar_words_in_go(tail, context, scalar_word_in(head, context))

          def scalar_words_in(elements: List<&2, I.Expr>, context: Context) -> Bool:
            scalar_words_in_go(elements, context, True{})
          '''
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          p = Path('compiler/arena_runtime.wat')
          text = p.read_text()
          old = ';; Only compiler-proven scalar arrays carry the pointer-free bit. Generic/host'
          assert text.count(old) == 1
          p.write_text(text.replace(old, ';; Only compiler-proven scalar payloads carry the pointer-free bit. Generic/host'))
          p = Path('compiler/RUNTIME_PERFORMANCE.md')
          text = p.read_text()
          old = '## Pointer-free array tracing\n'
          assert text.count(old) == 1
          text = text.replace(old, old + '\nThis section describes the initial direct-expression optimization. The subsequent\n[layout-propagation pass](LAYOUT_PROPAGATION.md) extends it through local bindings\nand product fields, and also recognizes scalar-only tuple and record payloads.\n')
          p.write_text(text)
          PY
          git diff --check
          deno fmt compiler/RUNTIME_PERFORMANCE.md
      - name: Install verified Bend
        run: |
          curl --fail --location --retry 3 https://github.com/bendlang/bend/releases/download/v2.0.32/bend-2.0.32-linux-x64.tar.gz -o "$RUNNER_TEMP/bend.tar.gz"
          echo "5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6  $RUNNER_TEMP/bend.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bend"
          tar -xzf "$RUNNER_TEMP/bend.tar.gz" -C "$RUNNER_TEMP/bend"
          echo "$RUNNER_TEMP/bend/bend/bin" >> "$GITHUB_PATH"
      - name: Verify proofs and exact rebuilt emitter
        run: |
          bend version
          bend guide > "$RUNNER_TEMP/bend-guide.txt"
          deno task generate:parser
          python3 scripts/build_runtime_reference.py
          mkdir -p build
          deno test --allow-read=compiler,generated,examples,std compiler/effect_family_wide.test.ts compiler/codegen_layout.test.ts compiler/codegen.test.ts 2>&1 | tee build/layout-width.log
          deno test --allow-read=compiler,generated,examples,std --filter javascript compiler/layout_propagation.test.ts compiler/scalar_array_layout.test.ts 2>&1 | tee build/layout-source.log
          tar -czf "$RUNNER_TEMP/layout-wide-candidate.tar.gz" compiler generated std scripts deno.json deno.lock baba.json build/layout-width.log build/layout-source.log
      - uses: actions/upload-artifact@v4
        with:
          name: layout-wide-candidate
          path: ${{ runner.temp }}/layout-wide-candidate.tar.gz
          retention-days: 3
      - name: Publish validated source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compiler/wasm.bend compiler/arena_runtime.wat compiler/RUNTIME_PERFORMANCE.md
          git commit -m 'fix: classify wide scalar arrays with a constant-stack traversal'
          git push origin HEAD:refs/heads/perf/runtime-data-paths
