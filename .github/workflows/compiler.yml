name: Compiler
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: squid-lang
concurrency:
  group: compiler-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: squid-lang
      # Browser kernel and render-copy tests need these public sibling sources.
      - name: Fetch pinned Pen and Ink sources
        shell: bash
        run: |
          fetch_sources() {
            local repo="$1" revision="$2"
            mkdir -p "../$repo"
            curl --fail --silent --show-error --location --retry 3 \
              "https://codeload.github.com/mewhhaha/$repo/tar.gz/$revision" \
              | tar -xz --strip-components=1 -C "../$repo"
          }
          fetch_sources pen b301f55cc94620a409444ffd001b490844c7886e
          fetch_sources ink 29b672fb7323bafc8c612885c3e9ba228bf60994
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install the compiler's build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('squid-lang/deno.lock') }}
          restore-keys: deno-${{ runner.os }}-
      # The compiler is written in Goose; its build first builds upstream Goose
      # with the patch series in compiler-goose/tools/upstream-32a4f44.
      - name: Cache the patched Goose compiler
        uses: actions/cache@v4
        with:
          path: squid-lang/build/goose-port
          key: goose-${{ runner.os }}-${{ hashFiles('squid-lang/compiler-goose/tools/upstream-32a4f44/**') }}
      - run: deno task check
      - run: deno publish --dry-run --allow-dirty
