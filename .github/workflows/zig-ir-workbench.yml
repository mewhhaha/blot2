name: Zig IR workbench

on:
  push:
    branches: [zig-ir-workbench]
    paths: ['.github/workflows/zig-ir-workbench.yml']

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cd3a43e36240bcbba661a05ecbe5b4d4066825b2
          persist-credentials: false
      - name: Export tracked baseline and pinned analyzer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ir-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/ir-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/ir-source/revision.txt"
          cd "$RUNNER_TEMP/ir-source"
          curl --fail --location --retry 3 -o zig-analyzer.tar.xz https://github.com/mewhhaha/zig-analyzer/releases/download/v0.16.0-5/zig-analyzer-0.16.0-5-x86_64-linux.tar.xz
          echo '108aead67169bc12fc3036f6295ef3eb5b8f5e0b35929f0b3cd18383e4c5b668  zig-analyzer.tar.xz' | sha256sum --check
          sha256sum source.tar zig-analyzer.tar.xz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zig-ir-source
          path: ${{ runner.temp }}/ir-source/
          retention-days: 1
          if-no-files-found: error
