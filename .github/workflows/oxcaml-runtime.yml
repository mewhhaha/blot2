name: OxCaml standalone
on:
  push:
    branches: [rebuild/oxcaml-compiler]
    paths: ['compiler/**', 'std/**', 'generated/wasm/**', '.github/workflows/oxcaml-runtime.yml']
  pull_request:
    paths: ['compiler/**', 'std/**', 'generated/wasm/**', '.github/workflows/oxcaml-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oxcaml-standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y opam autoconf build-essential
      - uses: actions/cache@v4
        with:
          path: ~/.opam
          key: oxcaml-5.2.0-ox-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install OxCaml
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0
          opam init --bare --disable-sandboxing -y
          if ! opam switch list --short | grep -Fxq 5.2.0+ox; then
            opam switch create 5.2.0+ox --repos ox=git+https://github.com/oxcaml/opam-repository.git,default -y
          fi
          opam exec --switch 5.2.0+ox -- ocamlopt -config
      - name: Build and test checked-in native source
        run: opam exec --switch 5.2.0+ox -- make -C compiler/oxcaml test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test without Bend or generated reference artifacts
        run: |
          test ! -f generated/compiler/compiler.js
          test ! -f generated/compiler/blotc
          deno run --allow-all compiler/oxcaml/smoke.ts
          deno run --allow-read --allow-write --allow-run compiler/oxcaml/cli.ts build examples/scalar.blot build/oxcaml-smoke.wasm
      - name: Export reproducible development snapshot
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p development-snapshot
          git archive --format=tar.gz HEAD > development-snapshot/source.tar.gz
          git rev-parse HEAD > development-snapshot/source.sha
          opam exec --switch 5.2.0+ox -- ocamlopt -config > development-snapshot/ocaml-config.txt
          tar -C "$HOME/.opam/5.2.0+ox" -czf development-snapshot/toolchain.tar.gz bin lib/ocaml
          cp compiler/oxcaml/_build/blotc development-snapshot/blotc
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: oxcaml-development-snapshot
          path: development-snapshot/
          retention-days: 3
