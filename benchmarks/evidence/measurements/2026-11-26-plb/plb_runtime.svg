<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1424 880" width="1424" height="880">
<style>
  .bg { fill: #fafafa; }
  .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 10; }
